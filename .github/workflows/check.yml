name: Verificar instalação
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: github-test-root
          MYSQL_DATABASE: agenda_test
          MYSQL_USER: agenda_test
          MYSQL_PASSWORD: github-test-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mockup/package-lock.json
      - run: npm ci
        working-directory: mockup
      - run: npm run build && npm test
        working-directory: mockup
      - run: npm test
        working-directory: mockup
        env:
          TEST_MYSQL_DB: agenda_test
          TEST_MYSQL_USER: agenda_test
          TEST_MYSQL_PASSWORD: github-test-db
      - run: docker compose config --quiet && docker compose build app
        env:
          APP_ORIGIN: https://agenda.example.com
          DB_PASSWORD: github-test-db
          DB_ROOT_PASSWORD: github-test-root
