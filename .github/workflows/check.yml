name: Verificar instalação
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: github-test-root
          MYSQL_DATABASE: agenda_test
          MYSQL_USER: agenda_test
          MYSQL_PASSWORD: github-test-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mockup/package-lock.json
      - run: npm ci
        working-directory: mockup
      - run: npm run build && npm test
        working-directory: mockup
      - run: npm test
        working-directory: mockup
        env:
          TEST_MYSQL_DB: agenda_test
          TEST_MYSQL_USER: agenda_test
          TEST_MYSQL_PASSWORD: github-test-db
      - run: docker compose config --quiet && docker compose build app
        env:
          APP_ORIGIN: https://agenda.example.com
          DB_PASSWORD: github-test-db
          DB_ROOT_PASSWORD: github-test-root
      - name: Iniciar aplicação, MySQL e HTTPS pelo Compose
        env:
          APP_ORIGIN: https://localhost
          DB_PASSWORD: github-test-db
          DB_ROOT_PASSWORD: github-test-root
        run: |
          docker compose up -d
          for attempt in $(seq 1 40); do
            if docker compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/rael-ca.crt" 2>/dev/null \
              && curl --max-time 4 --silent --show-error --fail --cacert "$RUNNER_TEMP/rael-ca.crt" https://localhost/ > "$RUNNER_TEMP/rael-root.html" \
              && grep -q 'Criar conta' "$RUNNER_TEMP/rael-root.html"; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail 50
          exit 1
      - name: Limpar ambiente de teste
        if: always()
        env:
          APP_ORIGIN: https://localhost
          DB_PASSWORD: github-test-db
          DB_ROOT_PASSWORD: github-test-root
        run: docker compose down --volumes
